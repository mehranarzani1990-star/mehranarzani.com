    #seawater-mechanism-v2 .viz-controls{justify-content:flex-end;margin:0 4px 4px;flex:0 0 auto}
    #seawater-mechanism-v2 .stage{width:100%;height:100%;min-height:0;overflow:hidden;flex:1 1 auto}
    #seawater-mechanism-v2 svg{display:block;width:100%;height:100%}
    #seawater-mechanism-v2 .unit{fill:color-mix(in srgb,var(--card) 68%,transparent);stroke:var(--border);stroke-width:2;opacity:.72}
    #seawater-mechanism-v2 .metal{fill:color-mix(in srgb,var(--muted) 62%,transparent);stroke:var(--muted-foreground);stroke-width:2;opacity:.62}
    #seawater-mechanism-v2 .pipe{fill:none;stroke:var(--muted-foreground);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
    #seawater-mechanism-v2 .flow{fill:none;stroke:var(--viz-series-1);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 17;animation:sm-flow 1s linear infinite}
    #seawater-mechanism-v2 .static-blue{fill:none;stroke:var(--viz-series-1);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.58}
    #seawater-mechanism-v2 .feed-flow{fill:none;stroke:var(--border);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 17;animation:sm-flow 1s linear infinite}
    #seawater-mechanism-v2 .reject{fill:none;stroke:var(--muted-foreground);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 14;animation:sm-reject 1.2s linear infinite;opacity:.8}
    #seawater-mechanism-v2 .recycle{fill:none;stroke:var(--muted-foreground);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 14;animation:sm-recycle 1.2s linear infinite;opacity:.8}

    #seawater-mechanism-v2 .water-soft{fill:color-mix(in srgb,var(--viz-series-1) 22%,transparent)}
    #seawater-mechanism-v2 .water-line{fill:none;stroke:var(--viz-series-1);stroke-width:2.5}

    #seawater-mechanism-v2 .permeate.delay{animation-delay:-.9s}

    #seawater-mechanism-v2 .filter-arrow.delay{animation-delay:-.9s}
    #seawater-mechanism-v2 .spiral{fill:none;stroke:var(--viz-series-1);stroke-width:3;stroke-linecap:round}
    #seawater-mechanism-v2 .pump{fill:color-mix(in srgb,var(--viz-series-1) 50%,transparent);transform-origin:center;transform-box:fill-box;animation:sm-pump .9s linear infinite}
    #seawater-mechanism-v2 .pour{fill:none;stroke:var(--viz-series-1);stroke-width:7;stroke-linecap:round;animation:sm-pour 1.4s ease-in-out infinite}
    #seawater-mechanism-v2 .patent-focus{fill:color-mix(in srgb,var(--viz-series-1) 5%,transparent);stroke:var(--viz-series-1);stroke-width:3;stroke-dasharray:4 8;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--viz-series-1) 42%,transparent));animation:sm-patent 2.4s ease-in-out infinite}
    #seawater-mechanism-v2 .patented-stage :is(.unit,.metal,.lumen,.water-line){opacity:1}
    #seawater-mechanism-v2 .patented-step-label{fill:var(--viz-series-1);font-size:21px;font-weight:800;letter-spacing:.015em;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--viz-series-1) 58%,transparent));animation:sm-label-color 4.6s ease-in-out infinite}
    #seawater-mechanism-v2 .sub.patented-step-label{fill:color-mix(in srgb,var(--foreground) 76%,transparent);font-size:15px;font-weight:650;letter-spacing:0;filter:none;animation:none}
    #seawater-mechanism-v2 .quiet-label{opacity:.68}
    #seawater-mechanism-v2 .wave{fill:none;stroke:var(--viz-series-1);stroke-width:3;animation:sm-wave 2s ease-in-out infinite}

<script id="codex-visualization-tooltip">/* oxlint-disable typescript/no-unsafe-argument, typescript/no-unsafe-call, typescript/no-unsafe-return */
// Runs inside the visualization sandbox, not the host webview.
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide-initialization">(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
